hydra:
  run:
    dir: ./train_logs/${now:%Y-%m-%d-%H%M%S}_${rl_algo.name}_envt=${env.task_name}_rm=${reward_model.name}_nt=${run_notes}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - env=Metaworld
    - env.env_reward_type=none
    - env.task_name=window-open-v2-goal-observable
    - env.temporal_encoding=true
    - reward_model=coverage
    - visual_encoder=resnet50
    - reward_model.cost_fn=diagonal_cosine
    - logging.wandb_mode=online
    - logging.video_save_freq=50000
    - reward_model.tau=1
    - rl_algo.discount_factor=0.9
  job:
    name: train
    chdir: null
    override_dirname: env.env_reward_type=none,env.task_name=window-open-v2-goal-observable,env.temporal_encoding=true,env=Metaworld,logging.video_save_freq=50000,logging.wandb_mode=online,reward_model.cost_fn=diagonal_cosine,reward_model.tau=1,reward_model=coverage,rl_algo.discount_factor=0.9,visual_encoder=resnet50
    id: ???
    num: ???
    config_name: train_config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /share/portal/wph52/CrossQ/scripts/train
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /share/portal/wph52/CrossQ/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /share/portal/wph52/CrossQ/scripts/train/train_logs/2024-12-18-133058_sb3_sac_envt=window-open-v2-goal-observable_rm=coverage_nt=None
    choices:
      visual_encoder: resnet50
      rl_algo: sb3_sac
      reward_model/modification: nothing
      reward_model: coverage
      env: Metaworld
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
